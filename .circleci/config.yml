version: 2.1


orbs:
  localstack: localstack/platform@2.1


jobs:
  save-state:
    executor: localstack/default
    steps:
      - checkout
      - restore_cache:
          keys:
            - python-deps-{{ checksum "requirements-dev.txt" }}
            - python-deps
      - run:
          name: Install Python 3.11
          command: |
            # Currently highest available 3.11 on CircleCI runner
            test -d /opt/circleci/.pyenv/versions/3.11.1 || pyenv install 3.11.1
            pyenv global 3.11.1
      - run:
          name: Install lstk
          command: npm install -g @localstack/lstk
      - run:
          name: Install dependencies
          command:
            pip3 install -r requirements-dev.txt --upgrade
      - run:
          name: Start LocalStack
          command: lstk start
      - run:
          name: Build lambdas
          command:
            deployment/build-lambdas.sh

      - run:
          name: Deploy infrastructure
          command:
            deployment/aws/deploy.sh

      - run:
          name: Export state
          command: lstk save ls-state.zip
      - persist_to_workspace:
          root: .
          paths:
            - ls-state.zip
      - save_cache:
          paths:
            - /opt/circleci/.pyenv/versions/3.11.1
          key: python-deps-{{ checksum "requirements-dev.txt" }}
      - store_artifacts:
          path: ls-state.zip


  load-state:
    executor: localstack/default
    environment:
        AWS_DEFAULT_REGION: us-east-1
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        LOCALSTACK_DEBUG: 1
        LOCALSTACK_LS_LOG: trace
    steps:
      - restore_cache:
          key: python-deps-
      - run:
          name: Choose python version
          command:
            pyenv global 3.11.1
      - run:
          name: Install lstk
          command: npm install -g @localstack/lstk
      - checkout
      - run:
          name: Install dependencies
          command:
            pip3 install -r requirements-dev.txt
      - run:
          name: Start LocalStack
          command: lstk start
      - attach_workspace:
          at: .
      - run:
          name: Import state
          command: test -f ls-state.zip && lstk load ls-state.zip
      - run:
          name: Run Tests
          command:
            pytest tests
      - run:
          when: on_fail
          name: Dump Localstack logs
          command: lstk logs | tee localstack.log
      - store_artifacts:
          path: localstack.log


workflows:
  do-tests:
    jobs:
      - save-state
      - load-state:
          requires: [save-state]